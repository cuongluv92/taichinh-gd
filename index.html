<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b0d" />
  <meta name="description" content="Quản lý tài chính gia đình: thu chi, tài sản, đầu tư, thẻ tín dụng và vay nợ." />
  <title>tcgd</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="unlock" class="unlock hidden">
    <div class="unlock-card">
      <div class="brand-mark">₫</div>
      <h1>Tài chính gia đình</h1>
      <p>Thiết bị này chưa có khóa gia đình. Mở bằng link riêng hoặc dán khóa một lần.</p>
      <form id="unlockForm" class="stack">
        <input id="unlockKey" autocomplete="off" placeholder="Khóa gia đình" required />
        <button class="btn primary" type="submit">Mở ứng dụng</button>
      </form>
      <small>Khóa chỉ được lưu trên thiết bị này. Không gửi khóa cho người khác.</small>
    </div>
  </div>

  <div id="loading" class="loading"><div class="spinner"></div><span>Đang tải dữ liệu…</span></div>
  <div id="toast" class="toast"></div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">₫</div><div><strong>Tài chính GD</strong><span id="familyNameSide">Gia đình</span></div></div>
      <nav id="nav" class="nav">
        <button data-view="dashboard"><i class="nav-icon" data-icon="overview" aria-hidden="true"></i><span>Tổng quan</span></button>
        <button data-view="budget" class="active"><i class="nav-icon" data-icon="wallet" aria-hidden="true"></i><span>Chi tiêu</span></button>
        <button data-view="investments"><i class="nav-icon" data-icon="invest" aria-hidden="true"></i><span>Đầu tư</span></button>
        <button data-view="accounts"><i class="nav-icon" data-icon="assets" aria-hidden="true"></i><span>Tài sản</span></button>
        <button data-view="settings"><i class="nav-icon" data-icon="settings" aria-hidden="true"></i><span>Cài đặt</span></button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><h1 id="pageTitle">Chi tiêu</h1><p id="pageSubtitle">Thu nhập, chi cố định, chi biến động, thẻ & trả góp, nợ trong tháng</p></div>
        <div class="top-actions">
          <button id="themeToggle" class="btn ghost icon-btn theme-toggle" type="button" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối" data-action="toggleTheme">
            <i class="nav-icon icon-sun" data-icon="sun" aria-hidden="true"></i><i class="nav-icon icon-moon" data-icon="moon" aria-hidden="true"></i>
          </button>
          <div class="month-nav" aria-label="Chọn tháng">
            <button class="btn month-step" type="button" data-action="changeMonth" data-a="[-1]" title="Tháng trước"><i class="nav-icon" data-icon="chevronLeft" aria-hidden="true"></i></button>
            <input id="monthPicker" type="month" />
            <button class="btn month-step" type="button" data-action="changeMonth" data-a="[1]" title="Tháng sau"><i class="nav-icon" data-icon="chevronRight" aria-hidden="true"></i></button>
          </div>
          <button id="quickAdd" class="btn primary"><i class="nav-icon" data-icon="plus" aria-hidden="true"></i>Nhập nhanh</button>
        </div>
      </header>
      <div id="content" class="content"></div>
    </main>

    <nav id="mobileNav" class="mobile-nav">
      <button data-view="dashboard"><i class="nav-icon" data-icon="overview" aria-hidden="true"></i><span>Tổng quan</span></button>
      <button data-view="budget" class="active"><i class="nav-icon" data-icon="wallet" aria-hidden="true"></i><span>Chi tiêu</span></button>
      <button data-view="investments"><i class="nav-icon" data-icon="invest" aria-hidden="true"></i><span>Đầu tư</span></button>
      <button data-view="accounts"><i class="nav-icon" data-icon="assets" aria-hidden="true"></i><span>Tài sản</span></button>
      <button data-view="settings"><i class="nav-icon" data-icon="settings" aria-hidden="true"></i><span>Cài đặt</span></button>
    </nav>
  </div>

  <dialog id="modal"><form method="dialog" id="modalForm" class="modal-card"><div id="modalBody"></div></form></dialog>

  <script src="/js/lib.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/finance.js" defer></script>
  <script src="/js/modals.js" defer></script>
  <script src="/js/views/budget.js" defer></script>
  <script src="/js/views/dashboard.js" defer></script>
  <script src="/js/views/investments.js" defer></script>
  <script src="/js/views/accounts.js" defer></script>
  <script src="/js/views/settings.js" defer></script>
  <script src="/js/app.js" defer></script>
</body>
</html>
